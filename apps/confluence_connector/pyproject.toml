[project]
name = "rag-confluence-connector"
version = "0.1.0"
description = "Outbound Confluence connector for RAG Platform"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
