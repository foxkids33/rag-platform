limit_req_zone $binary_remote_addr zone=rag_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=rag_upload_connections:10m;

server {
    # Port 80 is internal to this container; host 15173 carries TLS.
    listen 80 ssl;
    server_name 192.0.2.122;
    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RAG_TLS:10m;
    ssl_session_timeout 10m;
    server_tokens off;
    # Preserve old bookmarks, but never accept login/password traffic over HTTP.
    error_page 497 =308 https://192.0.2.122:15173$request_uri;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 110m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req zone=rag_auth burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        # Replace, rather than append, any untrusted client-supplied header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    # Authenticate before multipart bodies can reach FastAPI's spool files.
    # Request bodies stream into the API's bounded tmpfs, not server disk.
    location ~ ^/api/v1/(workspaces/[^/]+/documents|knowledge-bases/[^/]+/versions/[^/]+/documents)$ {
        auth_request /_rag_user;
        limit_conn rag_upload_connections 2;
        limit_conn_status 429;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }
    # FastAPI's documentation uses its official Swagger/ReDoc CDN assets and
    # inline initialization. Keep that exception out of the application UI.
    location ~ ^/api/(docs|redoc)(/|$) {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; object-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /runtime-config.js {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }
    location = /_rag_admin {
        internal;
        proxy_pass http://api:8000/api/v1/auth/admin-access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /_rag_user {
        internal;
        proxy_pass http://api:8000/api/v1/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /presentation/ {
        auth_request /_rag_admin;
        try_files $uri $uri/ =404;
    }
    location = /presentation-offline.zip {
        auth_request /_rag_admin;
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
