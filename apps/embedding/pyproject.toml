[project]
name = "rag-platform-embedding"
version = "0.1.0"
description = "Local multilingual embedding service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "fastembed>=0.6,<1",
  "numpy>=2.0,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
