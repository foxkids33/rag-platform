name: CI

on:
  push:
    branches: [main, feat/document-ingestion]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: rag
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://rag:rag@localhost:5432/rag
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          working-directory: apps/api
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run python -m pytest -q
        env:
          RUN_DATABASE_TESTS: "1"

  python-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [worker, embedding, reranker, confluence_connector]
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          working-directory: apps/${{ matrix.service }}
      - run: uv sync --frozen --all-groups
      - run: uv run python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node --test ../../scripts/ui/api-auth.test.mjs

  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest>=8,<9"
      - run: python -m pytest -q tests deploy/delivery/test_personal_confluence.py
      - run: python -m compileall -q deploy/confluence-vpn deploy/delivery
      - run: docker compose --env-file deploy/confluence-vpn/settings.env.example -f deploy/confluence-vpn/worker.compose.yaml config --quiet

  promote:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api, python-services, web, operations]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: rag-production-promotion
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Advance deploy/production to the tested main revision
        shell: bash
        run: |
          set -euo pipefail
          ref=refs/heads/deploy/production
          if git ls-remote --exit-code origin "$ref" >/dev/null; then
            git fetch --no-tags origin "$ref"
            if git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then exit 0; fi
          fi
          git push origin "$GITHUB_SHA:$ref"
