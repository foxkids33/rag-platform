[project]
name = "rag-platform-worker"
version = "0.1.0"
description = "RAG Platform ingestion worker"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "asyncpg>=0.30,<1",
  "minio>=7.2,<8",
  "pydantic-settings>=2.7,<3",
  "redis>=5.2,<7",
  "sqlalchemy[asyncio]>=2.0.36,<3",
]

[project.optional-dependencies]
docling = [
  "docling>=2.60,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
